# SPA fallback. Netlify serves /.netlify/functions/* before this rule;
# do not add a redirect from "/.netlify/*" — Netlify rejects that path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build]
  publish = "dist"
  command = "npm run build"

# Set in Netlify UI → Site settings → Environment variables:
#   CV_SYNC_API_KEY = <shared secret with analysis laptop>

[dev]
  command = "vite --port 5173 --host"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false
  framework = "#custom"
