# Optional Wrangler config for Cloudflare Pages + CV KV.
# Bindings can also be set only in the dashboard (Settings → Functions).

name = "hunter-eyes"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# After creating a KV namespace in the Cloudflare dashboard, paste its id here
# or bind the same name in Pages → Settings → Functions → KV namespace bindings.
# [[kv_namespaces]]
# binding = "CV_TELEMETRY"
# id = "YOUR_KV_NAMESPACE_ID"
